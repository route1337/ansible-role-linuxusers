# Manage user accounts and sudo privileges across Linux servers

- name: Prep prereqs
  ansible.builtin.import_tasks: prereqs.yml

- name: Manage the root user
  ansible.builtin.import_tasks: root.yml

- name: Manage non-root users
  ansible.builtin.import_tasks: users.yml
  when: linux_users.users is defined

- name: Clean up unmanaged users
  ansible.builtin.import_tasks: user_cleanup.yml
  when: linux_users.users is defined
