# Create and update users

- name: Add/update all specified users
  ansible.builtin.user:
    name: '{{ item.username }}'
    shell: '{{ zsh_path }}'
    comment: '{{ item.comment }}'
    create_home: true
    group: '{{ item.group }}'
  loop: "{{ linux_users.users }}"
  loop_control:
    label: '{{ item.username }}'

- name: Add/update all specified users' SSH keys
  ansible.posix.authorized_key:
    user: '{{ item.username }}'
    key: '{{ item.key }}'
    state: present
    exclusive: true
  loop: "{{ linux_users.users }}"
  loop_control:
    label: '{{ item.username }}'
